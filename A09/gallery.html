<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="oneui.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col">
                <div class="header-title">
                    Notes
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <div class="col">
                <div class="categories">
                    <span>All</span>
                    <span>Selfies</span>
                    <span>Videos</span>
                    <span>Saved</span>
                    <span onclick="reversepinch()">+</span>
                    <span onclick="pinch()">-</span>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <div class="col">
                <div class="gallery d-flex justify-content-left flex-wrap">
                    <div class="pic">

                    </div>
                    <div class="pic">

                    </div>
                    <div class="pic">

                    </div>
                    <div class="pic">

                    </div>
                    <div class="pic">

                    </div>
                    <div class="pic">

                    </div>
                    <div class="pic">

                    </div>
                    <div class="pic">

                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
    <script>
        var zoomState = 2;

        var dimensions = ["50px", "100px", "150px"];
        var radius = ["0px", "10px", "10px"];

        function pinch() {
            zoomState -= 1;
            zoomState = zoomState < 0 ? 0 : zoomState;

            var pictureElements = document.getElementsByClassName("pic");
            for (var i = 0; i < pictureElements.length; i++) {
                pictureElements[i].style.width = dimensions[zoomState];
                pictureElements[i].style.height = dimensions[zoomState];
                pictureElements[i].style.borderRadius = radius[zoomState];
            }
        }

        function reversepinch() {
            zoomState += 1;
            zoomState = zoomState > 2 ? 2 : zoomState; 

            var pictureElements = document.getElementsByClassName("pic");
            for (var i = 0; i < pictureElements.length; i++) {
                pictureElements[i].style.width = dimensions[zoomState];
                pictureElements[i].style.height = dimensions[zoomState];
                pictureElements[i].style.borderRadius = radius[zoomState];
            }
        }
    </script>
</body>

</html>
